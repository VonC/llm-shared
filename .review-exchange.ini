# Defaults for the independent review exchange.
#
# This file ships with llm-shared and holds the value used when nothing else
# says otherwise. A repository that drives a review through these tools may keep
# a file of the same name at its own root: the value read there wins, so a
# project whose reviews need longer or shorter waits changes one line without
# touching any code.
#
# A local file that is unreadable, that omits the section or the key, or that
# holds anything other than a positive integer is ignored, and this shipped
# value applies instead. A broken local file must never stop a review.
#
# The per-exchange marker still wins over both: a line
# `wait_timeout_seconds=<positive integer>` in the project-root `a.review-mode`
# file selects the wait for that exchange alone, and unlike the file below an
# invalid value there is fatal, because it was written deliberately for that
# run.
#
# 10800 seconds is three hours.
[review-exchange]
wait_timeout_seconds = 10800
